<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex">
    <script>
window.addEventListener("message", function(event) {
    // Affiche dans la console du hub pour voir si on reçoit l'appel
    console.log("Hub : Message reçu de " + event.origin);

    if (event.data === "get_cid") {
      var match = document.cookie.match(/(?:\^|; )_ga=([^;]*)/);
      if (match) {
        var cid = match[1].split('.').slice(-2).join('.');
        console.log("Hub : CID trouvé, envoi de " + cid);
        // On renvoie à l'origine qui a appelé
        event.source.postMessage({ type: "set_cid", cid: cid }, "*");
      }
    }
  }, false);
</script>
    </script>
  </head>
  <body></body>
</html>
