<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex">
    <script>
window.addEventListener("message", function(event) {
    // Affiche dans la console du hub pour voir si on reçoit l'appel
    console.log("Hub : Message reçu de " + event.origin);

    if (event.data === "get_last_visit") {

      
      var match = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('last_drenaud_visit='))
                    ?.split('=')[1];
      if (match) {
        console.log("Hub : LAST DATE trouvé, envoi de " + match);
        // On renvoie à l'origine qui a appelé
        event.source.postMessage({ type: "set_last_visit", last_visit: match }, "*");
      }
    }
  }, false);
</script>
    </script>
  </head>
  <body></body>
</html>
