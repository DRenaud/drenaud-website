<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex">
    <script>
      window.addEventListener("message", function(event) {
        var trustedDomains = ["https://ludistes-charentais.fr", 
                              "https://www.ludistes-charentais.fr""]; 
        // On extrait le nom d'hôte de l'origine reçue (ex: https://www.site.fr -> site.fr)

    // On vérifie si l'hôte fait partie de notre liste
    if (!trustedRoots.includes(event.origin)) return;
    
        if (event.data === "get_cid") {
          var match = document.cookie.match(/(?:\^|; )_ga=([^;]*)/);
          var fullCookie = match ? match[1] : null;
          if (fullCookie) {
              // On extrait la partie ID (ex: 12345.67890)
              var cid = fullCookie.split('.').slice(-2).join('.');
              event.source.postMessage({ type: "set_cid", cid: cid }, event.origin);
          }
        }
      }, false);
    </script>
  </head>
  <body></body>
</html>
